name: Latest posts
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/latest_posts.py
      - run: |
          git config user.name paoloap
          git config user.email 58889145+paoloap-py@users.noreply.github.com
          git diff --quiet || (git commit -am "Update latest posts" && git push)
